<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ t('app_name') }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="{{ url_for('index') }}" class="brand">🌿 {{ t('app_name') }}</a>

    <div class="nav-links">
      <a href="{{ url_for('dashboard') }}">{{ t('nav_dashboard') }}</a>
      <a href="{{ url_for('meal') }}">{{ t('nav_meal') }}</a>
      <a href="{{ url_for('exercise') }}">{{ t('nav_exercise') }}</a>
      <a href="{{ url_for('water') }}">{{ t('nav_water') }}</a>
      <a href="{{ url_for('medicine') }}">{{ t('nav_medicine') }}</a>
      <a href="{{ url_for('family') }}">{{ t('nav_family') }}</a>
      <a href="{{ url_for('settings') }}">{{ t('nav_settings') }}</a>
    </div>

    <div class="lang-switch">
      <a href="{{ url_for('set_language', lang_code='en') }}" class="{{ 'active' if current_lang == 'en' }}">EN</a>
      <span>|</span>
      <a href="{{ url_for('set_language', lang_code='hi') }}" class="{{ 'active' if current_lang == 'hi' }}">हिं</a>
    </div>
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <p>⚠️ {{ t('disclaimer') }}</p>
</footer>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
